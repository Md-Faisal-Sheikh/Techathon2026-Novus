<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Inter, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#0d121d"/>
  <text x="500" y="42" text-anchor="middle" fill="#e9eefb" font-size="24" font-weight="700">Office Power Monitor — System Diagram</text>
  <text x="500" y="66" text-anchor="middle" fill="#8493ad" font-size="13">One shared backend is the single source of truth for all 15 devices</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff9e40"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38c1b4"/>
    </marker>
  </defs>

  <!-- 1. Simulated Device Layer -->
  <rect x="60" y="110" width="220" height="150" rx="12" fill="#151f30" stroke="#26344f"/>
  <text x="170" y="136" text-anchor="middle" fill="#ff9e40" font-size="13" font-weight="700">1 · SIMULATED DEVICE LAYER</text>
  <text x="170" y="160" text-anchor="middle" fill="#e9eefb" font-size="12">store.js — in-memory model</text>
  <text x="170" y="182" text-anchor="middle" fill="#8493ad" font-size="11">3 rooms × (2 fans + 3 lights)</text>
  <text x="170" y="200" text-anchor="middle" fill="#8493ad" font-size="11">status · watts · room · lastChanged</text>
  <text x="170" y="222" text-anchor="middle" fill="#8493ad" font-size="11">tick() flips devices every 3s</text>
  <text x="170" y="244" text-anchor="middle" fill="#8493ad" font-size="11">accumulates kWh over time</text>

  <!-- 2. Backend API -->
  <rect x="390" y="90" width="220" height="200" rx="12" fill="#151f30" stroke="#26344f"/>
  <text x="500" y="116" text-anchor="middle" fill="#ff9e40" font-size="13" font-weight="700">2 · BACKEND API</text>
  <text x="500" y="140" text-anchor="middle" fill="#e9eefb" font-size="12">server.js (Express + Socket.IO)</text>
  <line x1="410" y1="152" x2="590" y2="152" stroke="#26344f"/>
  <text x="500" y="172" text-anchor="middle" fill="#8493ad" font-size="11">GET /api/state · /api/devices</text>
  <text x="500" y="190" text-anchor="middle" fill="#8493ad" font-size="11">GET /api/rooms/:name · /api/power</text>
  <text x="500" y="208" text-anchor="middle" fill="#8493ad" font-size="11">GET /api/alerts</text>
  <text x="500" y="234" text-anchor="middle" fill="#38c1b4" font-size="11">WebSocket: emits "state" on</text>
  <text x="500" y="250" text-anchor="middle" fill="#38c1b4" font-size="11">every device change (push)</text>
  <text x="500" y="274" text-anchor="middle" fill="#8493ad" font-size="11">alerts.js — anomaly rules</text>

  <!-- 3a. Web Dashboard -->
  <rect x="720" y="90" width="220" height="120" rx="12" fill="#151f30" stroke="#26344f"/>
  <text x="830" y="116" text-anchor="middle" fill="#ff9e40" font-size="13" font-weight="700">3a · WEB DASHBOARD</text>
  <text x="830" y="140" text-anchor="middle" fill="#e9eefb" font-size="12">public/ (SVG floor plan)</text>
  <text x="830" y="162" text-anchor="middle" fill="#8493ad" font-size="11">live device panel · power meter</text>
  <text x="830" y="180" text-anchor="middle" fill="#8493ad" font-size="11">alerts · glowing lights, fans spin</text>
  <text x="830" y="200" text-anchor="middle" fill="#38c1b4" font-size="11">updates with NO page refresh</text>

  <!-- 3b. Discord Bot -->
  <rect x="720" y="250" width="220" height="120" rx="12" fill="#151f30" stroke="#26344f"/>
  <text x="830" y="276" text-anchor="middle" fill="#ff9e40" font-size="13" font-weight="700">3b · DISCORD BOT</text>
  <text x="830" y="300" text-anchor="middle" fill="#e9eefb" font-size="12">bot.js (discord.js)</text>
  <text x="830" y="322" text-anchor="middle" fill="#8493ad" font-size="11">!status · !room · !usage · !alerts</text>
  <text x="830" y="340" text-anchor="middle" fill="#8493ad" font-size="11">reads SAME REST API as dashboard</text>
  <text x="830" y="360" text-anchor="middle" fill="#8493ad" font-size="11">LLM humanizer (optional)</text>

  <!-- 4. Users -->
  <rect x="720" y="420" width="220" height="90" rx="12" fill="#141b12" stroke="#3a4a2c"/>
  <text x="830" y="446" text-anchor="middle" fill="#a7d06a" font-size="13" font-weight="700">4 · THE BOSS / TEAM</text>
  <text x="830" y="470" text-anchor="middle" fill="#8493ad" font-size="11">Browser → live dashboard</text>
  <text x="830" y="488" text-anchor="middle" fill="#8493ad" font-size="11">Discord → quick answers &amp; alerts</text>

  <!-- Flows -->
  <!-- device layer -> backend -->
  <line x1="280" y1="185" x2="388" y2="185" stroke="#ff9e40" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="334" y="176" text-anchor="middle" fill="#ff9e40" font-size="10">state</text>

  <!-- backend -> dashboard (push) -->
  <line x1="610" y1="150" x2="718" y2="150" stroke="#38c1b4" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="664" y="142" text-anchor="middle" fill="#38c1b4" font-size="10">WS push</text>

  <!-- backend <-> bot (request/response) -->
  <line x1="610" y1="240" x2="718" y2="300" stroke="#ff9e40" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="256" text-anchor="middle" fill="#ff9e40" font-size="10">HTTP GET</text>

  <!-- dashboard -> user -->
  <line x1="830" y1="210" x2="830" y2="418" stroke="#a7d06a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
  <!-- bot -> user -->
  <line x1="900" y1="370" x2="900" y2="418" stroke="#a7d06a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>

  <!-- Alert path callout -->
  <rect x="60" y="330" width="520" height="120" rx="12" fill="#141a26" stroke="#26344f"/>
  <text x="80" y="356" fill="#ff5c5c" font-size="13" font-weight="700">TRACE: one device change → both interfaces</text>
  <text x="80" y="380" fill="#8493ad" font-size="11">① store.tick() flips "Work Room 2 · Fan 1" ON at 10 PM, sets lastChanged + onSince.</text>
  <text x="80" y="400" fill="#8493ad" font-size="11">② server emits "state" over WebSocket → dashboard fan starts spinning instantly, meter climbs.</text>
  <text x="80" y="420" fill="#8493ad" font-size="11">③ alerts.js sees ON outside 9–5 → after-hours alert appears in the dashboard panel.</text>
  <text x="80" y="440" fill="#8493ad" font-size="11">④ bot polls /api/alerts → posts "⚠️ Work Room 2 still has fans on at 10 PM" to Discord.</text>

  <text x="500" y="560" text-anchor="middle" fill="#8493ad" font-size="12">[ Simulated Device Layer ] → [ Backend API ] → [ Web Dashboard ] &amp;&amp; [ Discord Bot ] → User</text>
  <text x="500" y="590" text-anchor="middle" fill="#5a6a86" font-size="11">Both interfaces read the same store; there is exactly one source of truth.</text>
</svg>
