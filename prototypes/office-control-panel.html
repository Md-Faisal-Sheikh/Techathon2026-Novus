<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novus Office</title>
<style>
  :root{
    --bg:#0e1220; --panel:#161c2e; --panel2:#1c2440; --line:#28324e;
    --text:#e7ecf3; --muted:#939bb2; --accent:#4a9eff; --amber:#ffd24a;
    --good:#3ecf8e; --off:#5a6478;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1200px 700px at 70% -10%,#18213a 0,transparent 60%),var(--bg);
    background-color:var(--bg);
    color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:20px;
  }
  .wrap{max-width:1200px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  header .title h1{margin:0;font-size:20px;letter-spacing:.5px}
  header .title p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .pills{display:flex;gap:10px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:7px}
  .pill b{font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--off)}
  .dot.fan{background:var(--accent)} .dot.light{background:var(--amber)} .dot.pwr{background:var(--good)}

  .app{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  @media (max-width:900px){ .app{grid-template-columns:1fr} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .plan-card{padding:10px}
  svg.plan{width:100%;height:auto;display:block;border-radius:10px;background:#0b0f1a}

  h2.sect{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:2px 0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{
    font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px
  }
  button:hover{border-color:var(--accent);background:#232c4c}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:600}
  button.ghost{background:transparent}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent;padding:8px 14px}
  .seg button.active{background:var(--accent);color:#04122b;font-weight:600}

  table.rooms{width:100%;border-collapse:collapse;font-size:13px}
  table.rooms th{ text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:6px 6px}
  table.rooms td{padding:7px 6px;border-top:1px solid var(--line)}
  table.rooms .rname{font-weight:600}
  .mini{padding:6px 9px;font-size:12px;border-radius:8px}
  .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:14px;height:14px;border-radius:4px;display:inline-block}
  .hint{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}

  /* ---------- Dashboard (layout B): tiles · toolbar · hero plan · room cards ---------- */
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:820px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .tile .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:5px;line-height:1}
  .tile .v small{font-size:13px;color:var(--muted);font-weight:500}
  .tile.blue .v{color:var(--accent)}
  .tile.amber .v{color:var(--amber)}
  .tile.green .v{color:var(--good)}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
  .toolbar .grp{display:flex;align-items:center;gap:8px}
  .toolbar .grp b{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .toolbar .note{margin-left:auto;color:var(--muted);font-size:12px}

  .plan-hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}
  .plan-hero #plan{max-width:1040px;margin:0 auto}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:820px){ .cards{grid-template-columns:1fr} }
  .room-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .room-card h3{margin:0 0 12px;font-size:14px;letter-spacing:.4px}
  .rc-line{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:13px}
  .rc-line .lab{width:44px;color:var(--muted)}
  .pips{display:flex;gap:5px}
  .pip{width:15px;height:15px;border-radius:4px;background:var(--off);border:1px solid var(--line);transition:.2s}
  .pip.fan.on{background:var(--accent);border-color:var(--accent)}
  .pip.light.on{background:var(--amber);border-color:var(--amber)}
  .rc-cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .rc-btns{display:flex;gap:8px;margin-top:4px}
  .rc-btns button{flex:1;justify-content:center}

  /* ---------- Fan (rotation + inertia driven in JS so it spins about the true hub) ---------- */
  [data-fan],[data-light]{cursor:pointer}
  [data-fan]:focus,[data-light]:focus{outline:none}
  [data-fan]:focus-visible .fan-hit,[data-light]:focus-visible .l-hit{stroke:var(--accent);stroke-width:2}
  .fan .blade{fill:url(#blade)}
  .fan .fan-hub{fill:#2f2016}
  .fan .fan-blur{fill:#4a3222;opacity:0}   /* opacity set per-frame by JS = motion blur */
  .fan:hover .blade{fill:#6b4a34}

  /* ---------- Light ---------- */
  .light .glow{opacity:0;transition:opacity .3s}
  .light.on .glow{opacity:1}
  .light .bulb{fill:#8f887c;stroke:#6d675c;stroke-width:1;transition:fill .3s,stroke .3s}
  .light.on .bulb{fill:#ffd24a;stroke:#e8a838}
  .light:hover .bulb{stroke:var(--amber)}

  .room-dim{pointer-events:none;transition:opacity .35s}
  .room-label{fill:#4a4030;font-size:11px;font-weight:700;letter-spacing:.5px;text-anchor:middle}
  .room-label-bg{fill:#ffffffcc}
  /* small device labels on the plan (Fan 1, Light 2 …) with a soft halo for legibility */
  .dev-label{fill:#3a3328;font-size:8px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#f4eede;stroke-width:2px;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Novus Office</h1>
      <p>Click any fan to spin it, any light to toggle it</p>
    </div>
    <div class="row" style="margin:0">
      <button onclick="setAll(false)">All Off</button>
    </div>
  </header>

  <!-- ===== KPI tiles ===== -->
  <div class="tiles">
    <div class="tile blue"><div class="k">Fans On</div><div class="v" id="t-fans">6<small>/6</small></div></div>
    <div class="tile amber"><div class="k">Lights On</div><div class="v" id="t-lights">9<small>/9</small></div></div>
    <div class="tile"><div class="k">Devices On</div><div class="v" id="t-devices">15<small>/18</small></div></div>
    <div class="tile green"><div class="k">Power Draw (Now)</div><div class="v" id="t-power">0<small> W</small></div></div>
    <div class="tile"><div class="k">Est. Use</div><div class="v" id="t-energy">0.0<small> kWh/day</small></div></div>
  </div>

  <!-- ===== Global controls strip ===== -->
  <div class="toolbar">
    <div class="grp"><b>Fans</b><button onclick="setAllFans(true)">On</button><button onclick="setAllFans(false)">Off</button></div>
    <div class="grp"><b>Lights</b><button onclick="setAllLights(true)">On</button><button onclick="setAllLights(false)">Off</button></div>
    <div class="grp"><b>Fan&nbsp;speed</b>
      <div class="seg" id="speedSeg">
        <button data-speed="low">Low</button>
        <button data-speed="med" class="active">Med</button>
        <button data-speed="high">High</button>
      </div>
    </div>
  </div>

  <!-- ===== Hero floor plan (full width) ===== -->
  <div class="plan-hero">
    <div id="plan"></div>
  </div>

  <!-- ===== Per-room cards ===== -->
  <div class="cards" id="roomCards"></div>

  <p class="hint">💡 Everything is clickable on the plan. Keyboard: <b>Tab</b> to a device, <b>Enter/Space</b> to toggle.</p>
</div>

<script>
/* ---------------- Data model ---------------- */
const ROOMS = [
  {id:'draw', name:'DRAWING ROOM', x0:22,  x1:236, y0:22, y1:372, kind:'lounge', floor:'#eaddc2'},
  {id:'w1',   name:'WORK ROOM 1',  x0:236, x1:432, y0:22, y1:372, kind:'work',   floor:'#ecdcbc'},
  {id:'w2',   name:'WORK ROOM 2',  x0:432, x1:618, y0:22, y1:372, kind:'work',   floor:'#ece0c4'},
];

const fans = [], lights = [];
ROOMS.forEach(r=>{
  const w=r.x1-r.x0, h=r.y1-r.y0;
  const px=f=>r.x0+f*w, py=f=>r.y0+f*h;
  // 2 fans per room, numbered continuously across the office: Fan 1..6
  fans.push({id:r.id+'-f1', room:r.id, label:'Fan '+(fans.length+1), cx:px(.50), cy:py(.16), on:true});
  fans.push({id:r.id+'-f2', room:r.id, label:'Fan '+(fans.length+1), cx:px(.50), cy:py(.55), on:true});
  // 3 lights per room, numbered continuously: Light 1..9
  lights.push({id:r.id+'-l1', room:r.id, label:'Light '+(lights.length+1), cx:px(.24), cy:py(.16), on:true});
  lights.push({id:r.id+'-l2', room:r.id, label:'Light '+(lights.length+1), cx:px(.76), cy:py(.16), on:true});
  lights.push({id:r.id+'-l3', room:r.id, label:'Light '+(lights.length+1), cx:px(.50), cy:py(.90), on:true});
});

const state = { speed:'med' };
const FAN_W = 55, LIGHT_W = 12;   // watts per device

/* ---------------- SVG builders ---------------- */
function desk(cx,cy){ return `<g>
  <rect x="${cx-24}" y="${cy-5}" width="48" height="27" rx="3" fill="#a9825a"/>
  <rect x="${cx-24}" y="${cy-5}" width="48" height="6" fill="#8c6942"/>
  <rect x="${cx-8}"  y="${cy-2}" width="16" height="10" rx="1.5" fill="#2b3140"/>
  <rect x="${cx-9}"  y="${cy+21}" width="18" height="12" rx="4" fill="#5b6472"/></g>`; }

// Top-view sofa, centred at (cx,cy). Canonical: back along the top edge, seats face down.
// Rotate to seat it against a wall: 0=back-top, 180=back-bottom, -90=back-left, 90=back-right.
function sofa(cx,cy,W,D,n,rot){
  const arm=Math.min(12,W*0.16), backH=D*0.30, seatW=(W-2*arm)/n, f=v=>v.toFixed(1);
  let c='';
  for(let i=0;i<n;i++){ const sx=-W/2+arm+i*seatW;
    c+=`<rect x="${f(sx+1.5)}" y="${f(-D/2+backH+1)}" width="${f(seatW-3)}" height="${f(D-backH-3)}" rx="3" fill="#c6a982"/>`
     + `<rect x="${f(sx+1.5)}" y="${f(-D/2+2)}"      width="${f(seatW-3)}" height="${f(backH-1)}"   rx="2.5" fill="#ad8c65"/>`;
  }
  return `<g transform="translate(${cx},${cy}) rotate(${rot||0})">
    <rect x="${f(-W/2)}" y="${f(-D/2)}" width="${f(W)}" height="${f(D)}" rx="7" fill="#7f5f40"/>
    <rect x="${f(-W/2)}" y="${f(-D/2)}" width="${f(arm)}" height="${f(D)}" rx="6" fill="#956f4b"/>
    <rect x="${f(W/2-arm)}" y="${f(-D/2)}" width="${f(arm)}" height="${f(D)}" rx="6" fill="#956f4b"/>
    ${c}</g>`;
}

function furniture(r){
  const cx=(r.x0+r.x1)/2, w=r.x1-r.x0, h=r.y1-r.y0;
  if(r.kind==='lounge'){
    // Waiting lounge: a 3-seat sofa down the left wall with a rug in front of it.
    return `
    <rect x="64" y="150" width="114" height="136" rx="10" fill="#d9c9a8"/>
    ${sofa(53, 198, 104, 42, 3, -90)}`;
  }
  // work room: 4 desks
  let s='';
  [.27,.73].forEach(fx=>[.33,.73].forEach(fy=>{ s+=desk(r.x0+fx*w, r.y0+fy*h); }));
  return s;
}

function fanSVG(f){ const blade='M0,-5 Q6,-8 5,-15 Q4,-25 0,-27 Q-3.5,-25 -4.5,-15 Q-5.5,-8 0,-5 Z';
  return `<g class="fan on" data-fan="${f.id}" transform="translate(${f.cx},${f.cy})" tabindex="0" role="button" aria-label="Fan in ${f.room}">
  <circle class="fan-hit" r="27" fill="transparent"/>
  <circle r="26" fill="#000" opacity=".05"/>
  <circle class="fan-blur" r="25"/>
  <circle r="8.5" fill="#5a3d2b"/>
  <g class="blades">
    <path class="blade" d="${blade}"/>
    <path class="blade" d="${blade}" transform="rotate(120)"/>
    <path class="blade" d="${blade}" transform="rotate(240)"/>
  </g>
  <circle class="fan-hub" r="5"/>
  <circle r="1.8" fill="#7a5439"/>
  <text class="dev-label" x="0" y="34">${f.label}</text></g>`; }

function lightSVG(l){ return `<g class="light on" data-light="${l.id}" transform="translate(${l.cx},${l.cy})" tabindex="0" role="button" aria-label="${l.label}">
  <circle class="l-hit" r="16" fill="transparent"/>
  <circle class="glow" r="20" fill="url(#glow)"/>
  <circle class="bulb" r="7.5"/>
  <text class="dev-label" x="0" y="17">${l.label}</text></g>`; }

function buildPlan(){
  let rooms='';
  ROOMS.forEach(r=>{
    const cx=(r.x0+r.x1)/2;
    rooms += `
      <rect x="${r.x0}" y="${r.y0}" width="${r.x1-r.x0}" height="${r.y1-r.y0}" fill="${r.floor}"/>
      ${furniture(r)}
      <rect class="room-dim" id="dim-${r.id}" x="${r.x0}" y="${r.y0}" width="${r.x1-r.x0}" height="${r.y1-r.y0}" fill="#0a0e17" opacity="0"/>
      <rect class="room-label-bg" x="${cx-58}" y="${r.y0+6}" width="116" height="18" rx="9"/>
      <text class="room-label" x="${cx}" y="${r.y0+19}">${r.name}</text>`;
  });
  const devices = fans.map(fanSVG).join('') + lights.map(lightSVG).join('');

  return `<svg class="plan" viewBox="0 0 640 388" role="img" aria-label="Office floor plan — three rooms with fans and lights">
    <defs>
      <radialGradient id="glow">
        <stop offset="0"   stop-color="#ffe89a" stop-opacity=".95"/>
        <stop offset="42%" stop-color="#ffcf5a" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#ffcf5a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6e4c35"/>
        <stop offset="1" stop-color="#48301f"/>
      </linearGradient>
    </defs>

    <!-- building shell (rooms only — corridor/entry removed, no devices there) -->
    <rect x="12" y="12" width="616" height="364" rx="6" fill="#cbb896"/>
    <rect x="12" y="12" width="616" height="364" rx="6" fill="none" stroke="#35302b" stroke-width="9"/>

    ${rooms}

    <!-- interior walls between rooms -->
    <line x1="236" y1="16" x2="236" y2="372" stroke="#35302b" stroke-width="7"/>
    <line x1="432" y1="16" x2="432" y2="372" stroke="#35302b" stroke-width="7"/>

    <!-- windows on top wall -->
    <rect x="96"  y="9" width="70" height="6" rx="1" fill="#9fd0e6"/>
    <rect x="300" y="9" width="70" height="6" rx="1" fill="#9fd0e6"/>
    <rect x="500" y="9" width="70" height="6" rx="1" fill="#9fd0e6"/>

    ${devices}
  </svg>`;
}

/* ---------------- Render + wire ---------------- */
const plan = document.getElementById('plan');
plan.innerHTML = buildPlan();
const el = id => plan.querySelector(`[data-fan="${id}"],[data-light="${id}"]`);

// cache fan elements + per-fan animation state (angle/velocity for inertia)
fans.forEach(f=>{
  f.node   = plan.querySelector(`[data-fan="${f.id}"]`);
  f.blades = f.node.querySelector('.blades');
  f.blur   = f.node.querySelector('.fan-blur');
  f.angle  = Math.random()*360;   // desync so fans don't spin in lockstep
  f.vel    = 0;                   // deg/sec, eased toward target speed
});

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEEDS  = REDUCED ? {low:35,med:70,high:120} : {low:95,med:220,high:440}; // deg/sec
let rafId=null, lastT=0;
function ensureLoop(){ if(rafId===null){ lastT=performance.now(); rafId=requestAnimationFrame(tick); } }
function tick(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;   // clamp dt (e.g. after tab switch)
  let active=false;
  fans.forEach(f=>{
    const target = f.on ? SPEEDS[state.speed] : 0;
    f.vel += (target - f.vel) * Math.min(1, dt*3.5);        // inertia: smooth spin-up / coast-down
    if(target===0 && Math.abs(f.vel)<1.2) f.vel=0;          // settle to a full stop
    if(f.vel){ f.angle=(f.angle+f.vel*dt)%360; f.blades.setAttribute('transform',`rotate(${f.angle.toFixed(2)})`); }
    const ratio = Math.min(1, Math.abs(f.vel)/SPEEDS.high); // 0..1 -> motion-blur amount
    f.blur.style.opacity   = (ratio*0.5).toFixed(3);        // blades blur into a translucent disc
    f.blades.style.opacity = (1 - ratio*0.5).toFixed(3);
    if(f.vel!==0 || target!==0) active=true;
  });
  rafId = active ? requestAnimationFrame(tick) : null;      // stop the loop once everything is at rest
}

function toggleFan(id){ const f=fans.find(x=>x.id===id); f.on=!f.on; f.node.classList.toggle('on',f.on); ensureLoop(); refresh(); }
function toggleLight(id){ const l=lights.find(x=>x.id===id); l.on=!l.on; el(id).classList.toggle('on',l.on); refresh(); }

plan.addEventListener('click', e=>{
  const f=e.target.closest('[data-fan]'); if(f) return toggleFan(f.dataset.fan);
  const l=e.target.closest('[data-light]'); if(l) return toggleLight(l.dataset.light);
});
plan.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const f=e.target.closest('[data-fan]'); const l=e.target.closest('[data-light]');
  if(f||l){ e.preventDefault(); f?toggleFan(f.dataset.fan):toggleLight(l.dataset.light); }
});

/* speed segmented control */
document.getElementById('speedSeg').addEventListener('click', e=>{
  const b=e.target.closest('[data-speed]'); if(!b) return;
  state.speed=b.dataset.speed;
  document.querySelectorAll('#speedSeg button').forEach(x=>x.classList.toggle('active',x===b));
  ensureLoop();   // running fans ease toward the new target speed
});

/* master + bulk controls */
function setState(arr, on){ arr.forEach(d=>{ d.on=on; el(d.id).classList.toggle('on',on); }); ensureLoop(); refresh(); }
function setAll(on){ [...fans,...lights].forEach(d=>{ d.on=on; el(d.id).classList.toggle('on',on); }); ensureLoop(); refresh(); }
function setAllFans(on){ setState(fans,on); }
function setAllLights(on){ setState(lights,on); }
function setRoomFans(room,on){ setState(fans.filter(f=>f.room===room),on); }
function setRoomLights(room,on){ setState(lights.filter(l=>l.room===room),on); }

/* per-room cards */
document.getElementById('roomCards').innerHTML = ROOMS.map(r=>`
  <div class="room-card" data-room="${r.id}">
    <h3>${r.name}</h3>
    <div class="rc-line"><span class="lab">Fans</span><span class="pips" id="pips-${r.id}-fan"></span><span class="rc-cnt" id="cc-${r.id}-fan"></span></div>
    <div class="rc-line"><span class="lab">Lights</span><span class="pips" id="pips-${r.id}-light"></span><span class="rc-cnt" id="cc-${r.id}-light"></span></div>
    <div class="rc-btns">
      <button class="mini" onclick="toggleRoom('${r.id}','fan')">Toggle Fans</button>
      <button class="mini" onclick="toggleRoom('${r.id}','light')">Toggle Lights</button>
    </div>
  </div>`).join('');
function toggleRoom(room,type){
  const arr=(type==='fan'?fans:lights).filter(d=>d.room===room);
  setState(arr, arr.some(d=>!d.on));   // any off -> turn all on, else all off
}

/* KPI tiles · room-card pips · room dimming */
function tile(id,n,d){ document.getElementById(id).innerHTML = n+'<small>/'+d+'</small>'; }
function refresh(){
  const fOn=fans.filter(f=>f.on).length, lOn=lights.filter(l=>l.on).length;
  const power=fOn*FAN_W + lOn*LIGHT_W;
  tile('t-fans', fOn, fans.length);
  tile('t-lights', lOn, lights.length);
  tile('t-devices', fOn+lOn, fans.length+lights.length);
  document.getElementById('t-power').innerHTML  = power+'<small> W</small>';
  document.getElementById('t-energy').innerHTML = (power*24/1000).toFixed(1)+'<small> kWh/day</small>';
  ROOMS.forEach(r=>{
    const rf=fans.filter(f=>f.room===r.id), rl=lights.filter(l=>l.room===r.id);
    const litFrac = rl.filter(l=>l.on).length / rl.length;
    document.getElementById('dim-'+r.id).setAttribute('opacity', (1-litFrac)*0.5);
    document.getElementById('pips-'+r.id+'-fan').innerHTML   = rf.map(f=>`<i class="pip fan ${f.on?'on':''}"></i>`).join('');
    document.getElementById('pips-'+r.id+'-light').innerHTML = rl.map(l=>`<i class="pip light ${l.on?'on':''}"></i>`).join('');
    document.getElementById('cc-'+r.id+'-fan').textContent   = rf.filter(f=>f.on).length+'/'+rf.length;
    document.getElementById('cc-'+r.id+'-light').textContent = rl.filter(l=>l.on).length+'/'+rl.length;
  });
}
refresh();
ensureLoop();   // fans are on by default -> they spin up on load
</script>
</body>
</html>
